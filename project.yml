name: RivieraOlympics
options:
  bundleIdPrefix: org.shinkosha.pogi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: ../../Config/Signing.xcconfig
  Release: ../../Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  RivieraOlympics:
    type: application
    platform: iOS
    sources:
      - path: RivieraOlympics
    resources:
      - path: RivieraOlympics/Resources/Rulebook.md
        buildPhase: resources
      - path: RivieraOlympics/Resources/RivieraOlympicsRules.pdf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.shinkosha.pogi.rivieraolympics
        INFOPLIST_KEY_CFBundleDisplayName: リビエラオリンピック
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_FILE: RivieraOlympics/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: RivieraOlympics/RivieraOlympics.entitlements

schemes:
  RivieraOlympics:
    build:
      targets:
        RivieraOlympics: all
    run:
      config: Debug
    archive:
      config: Release
